apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.0
    helm:
      releaseName: istio-ingressgateway
      values: |
        service:
          # LoadBalancer + `minikube tunnel` gives the gateway a routable IP on
          # ports 80/443, so demo URLs (http://taskboard.local) don't need a
          # NodePort suffix. The tunnel must be running on the host.
          type: LoadBalancer
          ports:
            - name: status-port
              port: 15021
              targetPort: 15021
            - name: http2
              port: 80
              targetPort: 80
            - name: https
              port: 443
              targetPort: 443
        replicaCount: 1
        autoscaling:
          enabled: false
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    # The gateway chart ships image: "auto" — istiod rewrites it to the real
    # proxy image via mutating webhook, which only fires in namespaces labeled
    # istio-injection=enabled. managedNamespaceMetadata lets Argo own that label.
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
